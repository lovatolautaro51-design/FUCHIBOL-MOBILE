name: Build FUCHIBOL Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extraer proyecto
        run: |
          unzip -o "FUCHIBOL_MOBILE_V0_7_0_COMPLETO-1.zip" -d .
          test -f FUCHIBOL_MOBILE_V0_7_0/settings.gradle
          test -f FUCHIBOL_MOBILE_V0_7_0/app/build.gradle

      - name: Compilar APK debug
        working-directory: FUCHIBOL_MOBILE_V0_7_0
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FUCHIBOL-Mobile-APK
          path: FUCHIBOL_MOBILE_V0_7_0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
